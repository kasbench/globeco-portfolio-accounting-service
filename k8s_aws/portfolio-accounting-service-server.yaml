apiVersion: apps/v1
kind: Deployment
metadata:
  name: globeco-portfolio-accounting-service
  namespace: globeco
spec:
  {{- if eq .Values.autoscaler "vpa" }}
  replicas: 2
  {{- else }}
  replicas: 1
  {{- end }}

  # A newly-ready pod must remain ready for 10 seconds before
  # the Deployment considers it available.
  minReadySeconds: 10

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0

  selector:
    matchLabels:
      app: globeco-portfolio-accounting-service
  template:
    metadata:
      labels:
        app: globeco-portfolio-accounting-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:18.0
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h globeco-portfolio-accounting-service-postgresql -p 5432; do
                echo "Waiting for PostgreSQL to be ready..."
                sleep 2
              done
              echo "PostgreSQL is ready."
        - name: wait-for-redis
          image: redis:7-alpine
          command:
            - /bin/sh
            - -c
            - |
              until redis-cli -h globeco-portfolio-accounting-service-redis -p 6379 ping | grep -q PONG; do
                echo "Waiting for Redis to be ready..."
                sleep 2
              done
              echo "Redis is ready."
      containers:
        - name: globeco-portfolio-accounting-service
          image: kasbench/globeco-portfolio-accounting-service-server:1.0.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8087
          env:
            - name: KAFKA_BROKERS
              value: "globeco-execution-service-kafka:9093"
            - name: GLOBECO_PA_METRICS_ENHANCED_ENABLED
              value: "true"
            - name: GLOBECO_PA_METRICS_ENHANCED_SERVICE_NAME
              value: "globeco-portfolio-accounting-service"
            # - name: GODEBUG
            #   value: "http2debug=2"
            
            # Inject the node and pod metadata from the Downward API
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MY_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
              
            - name: GLOBECO_PA_TRACING_ENDPOINT
              value: "$(NODE_IP):4317"

            # Define standard service identity attributes
            - name: OTEL_SERVICE_NAME
              value: "globeco-portfolio-accounting-service" 
            - name: OTEL_SERVICE_NAMESPACE
              value: "globeco"
            
            # Inject Kubernetes metadata as resource attributes for k8sattributes processor
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: >-
                k8s.pod.ip=$(MY_POD_IP),
                k8s.pod.name=$(MY_POD_NAME),
                k8s.node.name=$(MY_NODE_NAME),
                k8s.namespace.name=$(MY_NAMESPACE)  

          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: RestartContainer
          resources:
            requests:
              cpu: 200m
              memory: 100Mi
            limits:
              cpu: 200m
              memory: 100Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8087
            # initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8087
            # initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8087
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: globeco-portfolio-accounting-service
  namespace: globeco
spec:
  selector:
    app: globeco-portfolio-accounting-service
  ports:
    - protocol: TCP
      port: 8087
      targetPort: 8087
  type: ClusterIP

{{- if eq .Values.autoscaler "vpa" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: globeco-portfolio-accounting-service-pdb
  namespace: globeco

spec:
  minAvailable: 1

  selector:
    matchLabels:
      app: globeco-portfolio-accounting-service
{{- end }}
